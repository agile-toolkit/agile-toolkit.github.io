<!DOCTYPE html>
<html lang="en" data-accent="cobalt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Network check — Agile Toolkit</title>
    <meta name="description" content="Checks whether team sessions in Planning Poker and Moving Motivators can connect from your network." />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
    <script>
      (function(){
        var t = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme',
          (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) ? 'dark' : 'light'
        );
      })();
    </script>
  </head>
  <body>
    <main class="nc-page">
      <div class="nc-top">
        <a class="nc-back" href="/" data-i18n="back">← Agile Toolkit</a>
        <label class="nc-lang">
          <span class="nc-sr-only" data-i18n="language">Language</span>
          <select id="nc-lang"></select>
        </label>
      </div>
      <h1 data-i18n="title">Network check</h1>
      <p class="nc-lead" data-i18n="lead"></p>

      <section id="nc-verdict" class="nc-verdict" aria-live="polite" hidden></section>

      <ul id="nc-list" class="nc-list" data-i18n-label="list_label"></ul>

      <div class="nc-actions">
        <button id="nc-run" class="nc-btn nc-btn-primary" type="button" data-i18n="run">Run again</button>
        <button id="nc-copy" class="nc-btn" type="button" data-i18n="copy" hidden>Copy results</button>
      </div>

      <div class="nc-notes">
        <p data-i18n="notes.ports"></p>
        <p data-i18n="notes.candidate"></p>
        <p data-i18n="notes.privacy"></p>
      </div>
    </main>
    <script type="module" src="/src/network-check/main.ts"></script>
  </body>
</html>
